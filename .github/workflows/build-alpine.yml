name: build-alpine

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: unbound
      build-args: |
        UNBOUND=1.26.2
      tags: |
        1.26.2-${VERSION}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
