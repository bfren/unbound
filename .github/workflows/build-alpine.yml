name: build-alpine

on:
  workflow_dispatch:

env:
  ALPINE: 3.24.2
  UNBOUND: 1.26.2
  IMAGE: quay.io/bfren-bin/unbound

jobs:
  build:
    strategy:
      matrix:
        include:
          -
            platform: linux/amd64
            runner: ubuntu-24.04
          -
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          -
            # GitHub's arm runners cannot run 32-bit arm code, so arm/v7 is built using QEMU
            platform: linux/arm/v7
            runner: ubuntu-24.04
            qemu: true
    runs-on: ${{ matrix.runner }}
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      -
        name: Get platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
        shell: bash
      -
        name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            ALPINE=${{ env.ALPINE }}
            UNBOUND=${{ env.UNBOUND }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
      -
        name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      -
        name: Read image version
        uses: bfren/read-file@v2
        with:
          file: ./VERSION
        id: version
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Create multi-platform image and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag=${IMAGE}:${UNBOUND}-${{ steps.version.outputs.contents }}
          docker buildx imagetools create -t ${tag} $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect ${tag}
        shell: bash
