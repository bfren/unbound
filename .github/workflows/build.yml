name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    # docs-only pushes would rebuild the same VERSION, which main refuses
    paths-ignore: ['**.md']
  workflow_dispatch:

# one run per branch at a time - on other branches a newer push cancels the older run, so it cannot finish last and
# overwrite the newer images; on main it waits, so a release is never cancelled halfway through tagging
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    strategy:
      matrix:
        unbound: [ "1.26.2" ]
    permissions:
      # to create the release
      contents: write
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: unbound
      build-args: |
        UNBOUND=${{ matrix.unbound }}
      tags: |
        ${{ matrix.unbound }}-${VERSION}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}

  # one check whose name does not change, for the ruleset to require - the matrix jobs are named after their versions,
  # so requiring them means editing the ruleset whenever a version is added or removed
  build-complete:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Check every build passed
        # needs.build.result is 'success' only if every job in the matrix succeeded
        run: test "${RESULT}" = "success" || { echo "The build matrix finished with result '${RESULT}'." ; exit 1 ; }
        env:
          RESULT: ${{ needs.build.result }}
